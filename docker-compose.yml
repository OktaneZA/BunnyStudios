services:
  db:
    image: postgres:17-alpine
    container_name: storyboard-db
    environment:
      POSTGRES_USER: storyboard
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: storyboard
    ports:
      - '5433:5432'
    volumes:
      - storyboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storyboard -d storyboard']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storyboard-pgdata:
